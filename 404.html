<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" href="/favicon.ico"><meta name="generator" content="Astro v7.3.8"><title>404 · 时·光选集</title><meta name="robots" content="index, follow"><link rel="canonical" href="https://clock.tomnut.com"><!-- Open Graph --><meta property="og:type" content="website"><meta property="og:title" content="404 · 时·光选集"><meta property="og:description"><meta property="og:url" content="https://clock.tomnut.com"><meta property="og:site_name"><meta property="og:locale" content="zh"><!-- Twitter Card --><meta name="twitter:card" content="summary"><meta name="twitter:title" content="404 · 时·光选集"><meta name="twitter:description"><!-- 主题色 --><meta name="theme-color" content="#f7f4ef"><style>*,:before,:after{box-sizing:border-box}html,body{margin:0;padding:0;overflow:hidden}:root{--bg:#f7f4ef;--ink:#1a1613;--ink-3:#7a7168;--ink-4:#a89f94;--accent:#c2410c;--serif:"Songti SC", "SimSun", "Noto Serif SC", Georgia, serif;--ease:cubic-bezier(.22, 1, .36, 1)}.nf{text-align:center;background:var(--bg);min-height:100dvh;color:var(--ink);flex-direction:column;justify-content:center;align-items:center;padding:4rem 2rem;display:flex}.nf-clock{justify-content:center;align-items:center;width:96px;height:96px;margin-bottom:3rem;display:flex;position:relative}.nf-ring{border:1.5px solid var(--ink);border-radius:50%;position:absolute;inset:0}.nf-hand{background:var(--ink);transform-origin:bottom;width:1.5px;transition:transform .4s var(--ease);border-radius:1px;position:absolute;bottom:50%;left:50%;transform:translate(-50%)rotate(0)}.nf-hand-hour{height:24px}.nf-hand-minute{opacity:.55;height:34px}.nf-dot{background:var(--accent);border-radius:50%;width:5px;height:5px;position:absolute}.nf-code{font-family:var(--serif);letter-spacing:-.04em;color:var(--ink);font-variant-numeric:tabular-nums;margin-bottom:1.5rem;font-size:clamp(4rem,12vw,7rem);font-weight:600;line-height:1}.nf-title{font-family:var(--serif);color:var(--ink);letter-spacing:.02em;margin-bottom:1.25rem;font-size:clamp(1.4rem,3vw,1.8rem);font-weight:600}.nf-desc{color:var(--ink-3);letter-spacing:.005em;max-width:420px;margin-bottom:3rem;font-size:.95rem;line-height:1.9}.nf-home{border:1px solid var(--ink);color:var(--ink);letter-spacing:.05em;transition:all .35s var(--ease);background:0 0;border-radius:100px;align-items:center;gap:10px;padding:12px 24px;font-size:.85rem;text-decoration:none;display:inline-flex}.nf-home svg{transition:transform .35s var(--ease)}.nf-home:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}.nf-home:hover svg{transform:translate(4px)}.nf-foot{font-family:var(--serif);color:var(--ink-4);letter-spacing:.08em;margin-top:5rem;font-size:.78rem}@media (width<=560px){.nf{padding:3rem 1.5rem}.nf-clock{width:80px;height:80px;margin-bottom:2.5rem}.nf-hand-hour{height:20px}.nf-hand-minute{height:28px}.nf-desc{margin-bottom:2.5rem}.nf-foot{margin-top:4rem}}
</style></head><body><div class="nf"><div class="nf-clock" aria-hidden="true"><div class="nf-ring"></div><div class="nf-hand nf-hand-hour"></div><div class="nf-hand nf-hand-minute"></div><div class="nf-dot"></div></div><div class="nf-code">404</div><h1 class="nf-title" id="nf-title">时光迷途</h1><p class="nf-desc" id="nf-desc">这一页似乎被时间吞没了。<br>但你的时钟还在走，不如回到当下。</p><a class="nf-home" id="nf-home" href="/zh/"><span>回到首页</span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a><div class="nf-foot" id="nf-foot">时·光选集 — 每一秒都在寻找</div></div><script>
    (function () {
      // 语言识别
      var path = window.location.pathname;
      var lang = path.split("/").filter(Boolean)[0] || "zh";
      var isEn = lang === "en";

      document.documentElement.lang = isEn ? "en" : "zh";
      document.title = isEn ? "404 · Time Light Collection" : "404 · 时·光选集";

      var t = document.getElementById("nf-title");
      if (t) t.textContent = isEn ? "Lost in Time" : "时光迷途";

      var d = document.getElementById("nf-desc");
      if (d)
        d.innerHTML = isEn
          ? "This page seems to have been swallowed by time.<br>But your clock is still ticking — perhaps back to the present?"
          : "这一页似乎被时间吞没了。<br>但你的时钟还在走，不如回到当下。";

      var h = document.getElementById("nf-home");
      if (h) {
        h.querySelector("span").textContent = isEn
          ? "Back to home"
          : "回到首页";
        h.href = isEn ? "/en/" : "/zh/";
      }

      var f = document.getElementById("nf-foot");
      if (f)
        f.textContent = isEn
          ? "Time Collection — every second is a search"
          : "时·光选集 — 每一秒都在寻找";

      // 时钟走针
      var hour = document.querySelector(".nf-hand-hour");
      var minute = document.querySelector(".nf-hand-minute");

      function tick() {
        var now = new Date();
        var m = now.getMinutes();
        var h = now.getHours() % 12;
        var minuteDeg = m * 6;
        var hourDeg = h * 30 + m * 0.5;
        if (minute)
          minute.style.transform =
            "translateX(-50%) rotate(" + minuteDeg + "deg)";
        if (hour)
          hour.style.transform = "translateX(-50%) rotate(" + hourDeg + "deg)";
      }

      tick();
      setInterval(tick, 1000 * 30);
    })();
  </script></body></html>
