             tracking-[0.02em] text-ink">时光迷途</h1><p id="nf-desc" class="mb-12 max-w-[420px] text-[0.95rem] leading-[1.9] tracking-[0.005em] text-ink-3
             max-sm:mb-10">这一页似乎被时间吞没了。<br>但你的时钟还在走，不如回到当下。</p><a id="nf-home" href="/zh/" class="group inline-flex items-center gap-2.5 rounded-full border border-ink
             bg-transparent px-6 py-3 text-[0.85rem] tracking-[0.05em] text-ink
             no-underline transition-all duration-[350ms] ease-soft
             hover:bg-ink hover:text-bg hover:border-ink"><span>回到首页</span><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="transition-transform duration-[350ms] ease-soft group-hover:translate-x-1"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a><div id="nf-foot" class="mt-20 font-serif text-[0.78rem] tracking-[0.08em] text-ink-4
             max-sm:mt-16">时·光选集 — 每一秒都在寻找</div></div><script>
    (function () {
      // 语言识别
      var path = window.location.pathname;
      var lang = path.split("/").filter(Boolean)[0] || "zh";
      var isEn = lang === "en";

      document.documentElement.lang = isEn ? "en" : "zh";
      document.title = isEn ? "404 · Time Light Collection" : "404 · 时·光选集";

      var t = document.getElementById("nf-title");
      if (t) t.textContent = isEn ? "Lost in Time" : "时光迷途";

      var d = document.getElementById("nf-desc");
      if (d)
        d.innerHTML = isEn
          ? "This page seems to have been swallowed by time.<br>But your clock is still ticking — perhaps back to the present?"
          : "这一页似乎被时间吞没了。<br>但你的时钟还在走，不如回到当下。";

      var h = document.getElementById("nf-home");
      if (h) {
        h.querySelector("span").textContent = isEn
          ? "Back to home"
          : "回到首页";
        h.href = isEn ? "/en/" : "/zh/";
      }

      var f = document.getElementById("nf-foot");
      if (f)
        f.textContent = isEn
          ? "Time Collection — every second is a search"
          : "时·光选集 — 每一秒都在寻找";

      // 时钟走针
      var hour = document.querySelector(".nf-hand-hour");
      var minute = document.querySelector(".nf-hand-minute");

      function tick() {
        var now = new Date();
        var m = now.getMinutes();
        var h = now.getHours() % 12;
        var minuteDeg = m * 6;
        var hourDeg = h * 30 + m * 0.5;
        if (minute)
          minute.style.transform =
            "translateX(-50%) rotate(" + minuteDeg + "deg)";
        if (hour)
          hour.style.transform = "translateX(-50%) rotate(" + hourDeg + "deg)";
      }

      tick();
      setInterval(tick, 1000 * 30);
    })();
  </script></body></html>
