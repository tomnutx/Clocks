<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Kindle 时钟 - 简洁电子墨水屏时间日期显示</title>
    <meta name="description" content="一个专为 Kindle 等电子墨水屏设备设计的简洁时钟页面，全屏显示当前时间、日期和星期，适合作为常亮时钟使用。"/>
    <meta name="keywords" content="Kindle时钟,电子墨水屏时钟,墨水屏时间显示,Kindle时钟屏保,全屏时钟,网页时钟"/>
    <meta name="robots" content="index, follow"/>
    <link rel="canonical" href="https://clock.tomnut.com/"/>
    <!-- Open Graph -->
    <meta property="og:type" content="website"/>
    <meta property="og:title" content="Kindle 时钟 - 简洁电子墨水屏时间日期显示"/>
    <meta property="og:description" content="一个专为 Kindle 等电子墨水屏设备设计的简洁时钟页面，全屏显示当前时间、日期和星期。"/>
    <meta property="og:url" content="https://clock.tomnut.com/"/>
    <meta property="og:site_name" content="Kindle 时钟"/>
    <meta property="og:locale" content="zh_CN"/>
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary"/>
    <meta name="twitter:title" content="Kindle 时钟 - 简洁电子墨水屏时间日期显示"/>
    <meta name="twitter:description" content="一个专为 Kindle 等电子墨水屏设备设计的简洁时钟页面，全屏显示当前时间、日期和星期。"/>
    <!-- 主题色 -->
    <meta name="theme-color" content="#ffffff"/>
    <style>body{color:#000000;background-color:#ffffff;}.page{position:fixed;width:100%;height:100%;}.time_container,.date_container{width:100%;margin:auto;text-align:center;}.time_container{top:0;height:55%;}.time{padding-top:120px;font-size:16rem;}.date{padding-top:40px;font-size:6rem;}</style>
</head>

<body>
    <div class="page">
      <div class="time_container">
          <div class="time" id="time">11:27</div>
      </div>

      <div class="date_container">
          <div class="date" id="date">1月10日</div>
          <div class="date" id="week">星期三</div>
      </div>
    </div>
    <script>
      function update() {
        var date = new Date()
        var utc8DiffMinutes = date.getTimezoneOffset() + 480
        date.setMinutes(date.getMinutes() + utc8DiffMinutes)

        var timeString = date.getHours() + ':' + ('0' + date.getMinutes()).slice(-2)
        var dateString = (date.getMonth() + 1) + '月' + date.getDate() + '日'
        var weekList = ['日', '一', '二', '三', '四', '五', '六']
        var weekString = '星期' + weekList[date.getDay()]

        document.getElementById("time").innerHTML = timeString
        document.getElementById("date").innerHTML = dateString
        document.getElementById("week").innerHTML = weekString
      }

      update()
      setInterval("update()", 60 * 1000)
    </script>
</body>
</html>
